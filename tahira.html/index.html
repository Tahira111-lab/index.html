<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tahira's Theater 🎬🍿</title>
  <link rel="stylesheet" href="css/style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron&display=swap" rel="stylesheet">
</head>
<body>
  <section class="container">
    <h1>Welcome to Tahira's Theater 🎥</h1>
    
    <div class="video-frame">
      <video src="media/trailer.mp4" controls></video>
    </div>

    <div class="buttons">
      <button onclick="document.querySelector('video').currentTime = 0; document.querySelector('video').play();">Play Again</button>
      <button onclick="alert('Thank you for watching! Rate coming soon!')">Rate Movie</button>
    </div>
  </section>
</body>
</html>
